<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Recording Overlay</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash.
      // The Rust store is the source of truth and re-asserts the resolved theme
      // in every `show-overlay` payload; this only covers the very first frame,
      // reading the same localStorage mirror App.tsx keeps in sync.
      (function () {
        try {
          var pref = localStorage.getItem("ss-theme-preference") || "system";
          var resolved =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="ss-overlay-document">
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
