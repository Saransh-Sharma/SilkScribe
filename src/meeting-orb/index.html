<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>SilkScribe</title>
    <script>
      // Apply the theme before first paint to avoid a light/dark flash. Reads the
      // same localStorage mirror App.tsx keeps in sync; MeetingOrb.tsx follows
      // later changes.
      (function () {
        try {
          var pref = localStorage.getItem("ss-theme-preference") || "system";
          var resolved =
            pref === "light" || pref === "dark"
              ? pref
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="ss-overlay-document">
    <div id="root"></div>
    <script type="module" src="/src/meeting-orb/main.tsx"></script>
  </body>
</html>
