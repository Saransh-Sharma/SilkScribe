name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Skip copying the bundled models (gigabytes); tests and checks don't need them.
  TAURI_CONFIG: '{"bundle":{"resources":[]}}'

jobs:
  checks:
    name: Tests and checks (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-macos-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build frontend (type-checks too)
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Translations
        run: bun run check:translations

      - name: Worker tests
        run: bun run test:workspace-worker

      - name: Browser tests
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test --reporter=line

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Bindings are committed
        run: git diff --exit-code -- src/bindings.ts

      - name: Mac App Store build compiles
        working-directory: src-tauri
        run: cargo check --lib --no-default-features --features mac-app-store

  compile:
    name: Compiles on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-layer-shell-dev libasound2-dev libxdo-dev libssl-dev \
            libvulkan-dev glslc

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "1.4.309.0"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          "VULKAN_SDK=C:\VulkanSDK\$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$version\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # windows-latest ships Visual Studio 2026, which the cmake crate behind
      # whisper.cpp (0.1.54) can't detect on its own; name the generator.
      - name: Use the Visual Studio 2026 generator (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Visual Studio 18 2026" >> "$GITHUB_ENV"

      # The app embeds the built frontend; a stub is enough to compile.
      - name: Stub the frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Check
        working-directory: src-tauri
        run: cargo check --lib
